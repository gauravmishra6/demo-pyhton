version: 0.2

phases:
  install:
    commands:
      - echo "Updating pip..."
      - pip install --upgrade pip
      - echo "Installing dependencies..."
      - pip install opencv-python numpy mediapipe
      - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

  build:
    commands:
      - echo "Starting build..."
      - python HandTrackin_module.py

artifacts:
  files:
    - '**/*'
